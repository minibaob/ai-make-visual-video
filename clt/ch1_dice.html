<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中心极限定理 · 一颗骰子</title>
<style>
  :root{--bg:#0A0A0F;--blue:#58C4DD;--green:#83C167;--yellow:#FFD93D;--red:#FF6B6B;--text:#EAEAEA;--muted:#8a8a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"JetBrains Mono","SF Mono","Consolas",monospace;color:var(--text);}
  #stage{width:960px;max-width:96vw;aspect-ratio:16/9;position:relative;background:radial-gradient(120% 120% at 50% 0%, #14142a 0%, var(--bg) 60%);border:1px solid #23233a;border-radius:14px;overflow:hidden;box-shadow:0 0 80px rgba(88,196,221,0.10);}
  canvas{display:block;width:100%;height:100%;}
  .tag{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:2px;color:var(--muted);}
  .tag em{color:var(--blue);font-style:normal;}
  #controls{margin-top:18px;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);}
  button{font-family:inherit;font-size:12px;letter-spacing:1px;background:#1a1a28;color:var(--text);border:1px solid #2c2c44;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.2s;}
  button:hover{background:#23233a;border-color:var(--blue);}
</style>
</head>
<body>
  <div id="stage">
    <div class="tag"><em>■</em> CH1 / 一颗骰子</div>
    <canvas id="cv"></canvas>
  </div>
  <div id="controls"><button id="reset">↺ 重播</button></div>

<script>
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);let W=960,H=540;
function resize(){
  const s=document.getElementById('stage');const r=s.getBoundingClientRect();
  W=Math.round(r.width)||960;H=Math.round(r.height)||540;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

const FPS=30, TOTAL=2130;
let frame=0;
const cl=(v,a=0,b=1)=>Math.min(1,Math.max(0,(v-a)/(b-a)));
const easeOut=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const C={bg:'#0A0A0F',blue:'#58C4DD',green:'#83C167',yellow:'#FFD93D',red:'#FF6B6B',text:'#EAEAEA',muted:'#8a8a9a'};

function text(str,x,y,o){
  o=o||{};
  const size=o.size||24,color=o.color||C.text,weight=o.weight||500,
        align=o.align||'center',baseline=o.baseline||'middle',
        alpha=(o.alpha===undefined?1:o.alpha),blur=o.blur||0;
  if(alpha<=0.002)return;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.font=weight+' '+size+'px "JetBrains Mono","Consolas",monospace';
  ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=baseline;
  if(blur){ctx.shadowColor=color;ctx.shadowBlur=blur;}
  ctx.fillText(str,x,y);ctx.restore();
}

/* ---------- 骰子叠加：精确卷积 ---------- */
const MU=3.5, SD=Math.sqrt(35/12);
const distCache={};
function diceDist(n){
  if(distCache[n])return distCache[n];
  let p=[1];
  for(let k=0;k<n;k++){
    const q=new Array(p.length+6).fill(0);
    for(let i=0;i<p.length;i++){for(let d=0;d<6;d++)q[i+d]+=p[i];}
    p=q;
  }
  const s=p.reduce((a,b)=>a+b,0);
  const arr=p.map(v=>v/s);
  distCache[n]=arr;
  return arr;
}
const zOf=(s,n)=>(s-n*MU)/(SD*Math.sqrt(n));

/* ---------- 坐标系（标准化 z 轴，固定 [-4,4]） ---------- */
const ZMIN=-4, ZMAX=4;
const px=z=>W*0.5+z/(ZMAX-ZMIN)*(W*0.84);

/* ---------- 阶段表 ---------- */
const stages=[
  {n:1,  a:5.4,  b:19.0, cap:'6 个结果，每个概率完全一样——平的'},
  {n:2,  a:19.0, b:31.0, cap:'两颗骰子相加：中间多，两头少'},
  {n:3,  a:31.0, b:39.0, cap:'三颗：已经能看出中间鼓起来了'},
  {n:4,  a:39.0, b:45.0, cap:'四颗：轮廓开始变顺'},
  {n:6,  a:45.0, b:51.0, cap:'六颗：钟形初现'},
  {n:10, a:51.0, b:57.0, cap:'十颗：几乎认不出它是骰子'},
  {n:20, a:57.0, b:63.0, cap:'二十颗：这就是正态曲线'},
  {n:40, a:63.0, b:70.5, cap:'四十颗：和一条数学曲线重合'},
];

function histDraw(n, alpha, fillColor){
  const p=diceDist(n);
  const pmax=Math.max.apply(null,p);
  const baseY=H*0.80, maxH=H*0.44;
  const lo=n, hi=6*n; // 和的范围：最小值 n，最大值 6n
  const slotW=px(zOf(hi,n))-px(zOf(lo,n));
  const bw=slotW/(p.length);

  ctx.save();ctx.globalAlpha=alpha;

  // 曲线轮廓（柱数多时）
  if(p.length>70){
    ctx.beginPath();
    for(let i=0;i<p.length;i++){
      const z=zOf(lo+i,n);
      const x=px(z), y=baseY-maxH*(p[i]/pmax);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.lineTo(px(zOf(hi,n)),baseY);
    ctx.lineTo(px(zOf(lo,n)),baseY);
    ctx.closePath();
    const g=ctx.createLinearGradient(0,baseY-maxH,0,baseY);
    g.addColorStop(0,fillColor);g.addColorStop(1,'rgba(88,196,221,0.04)');
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();
    for(let i=0;i<p.length;i++){
      const x=px(zOf(lo+i,n)), y=baseY-maxH*(p[i]/pmax);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle=fillColor;ctx.lineWidth=3.5;ctx.shadowColor=fillColor;ctx.shadowBlur=14;ctx.stroke();
  }else{
    // 柱状
    ctx.fillStyle=fillColor;
    for(let i=0;i<p.length;i++){
      const z=zOf(lo+i,n);
      const x=px(z);
      const hh=maxH*(p[i]/pmax);
      const w=Math.max(bw*0.72,2.5);
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(x-w/2,baseY-hh,w,hh,[3,3,0,0]);
      else ctx.rect(x-w/2,baseY-hh,w,hh);
      ctx.fill();
    }
  }
  ctx.restore();
  return {pmax, baseY, maxH};
}

/* 理论正态曲线（单位方差，峰值对齐） */
function normalCurve(alpha,color){
  const baseY=H*0.80, maxH=H*0.44;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.beginPath();
  for(let i=0;i<=260;i++){
    const z=ZMIN+(ZMAX-ZMIN)*i/260;
    const y=baseY-maxH*Math.exp(-z*z/2);
    i===0?ctx.moveTo(px(z),y):ctx.lineTo(px(z),y);
  }
  ctx.strokeStyle=color;ctx.lineWidth=3;ctx.setLineDash([12,9]);
  ctx.shadowColor=color;ctx.shadowBlur=10;
  ctx.stroke();ctx.restore();
}

function draw(){
  const t=frame/FPS;
  ctx.clearRect(0,0,W,H);

  /* 章节标题卡 */
  if(t<5.6){
    const a=easeOut(cl(t,0.3,1.5))*(1-cl(t,4.6,5.6));
    text('第 一 章',W/2,H*0.40,{size:26,color:C.blue,alpha:a});
    text('一颗骰子，如何生出钟形',W/2,H*0.50,{size:56,weight:700,alpha:a,blur:18});
    text('不必相信任何假设——只要一直加下去',W/2,H*0.60,{size:24,color:C.muted,alpha:easeOut(cl(t,1.6,3.0))*(1-cl(t,4.6,5.6))});
    return;
  }

  /* 坐标轴 */
  const baseY=H*0.80;
  ctx.save();
  ctx.strokeStyle='rgba(180,180,210,0.35)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(W*0.06,baseY);ctx.lineTo(W*0.94,baseY);ctx.stroke();
  // 刻度
  ctx.font='500 20px "JetBrains Mono",monospace';
  ctx.fillStyle='rgba(200,200,220,0.75)';ctx.textAlign='center';ctx.textBaseline='top';
  for(let z=-3;z<=3;z++){
    const x=px(z);
    ctx.beginPath();ctx.moveTo(x,baseY);ctx.lineTo(x,baseY+8);
    ctx.strokeStyle='rgba(180,180,210,0.45)';ctx.stroke();
    ctx.fillText(z===0?'0':(z>0?'+'+z:String(z)),x,baseY+16);
  }
  ctx.restore();
  text('标准化离差  (和 − 期望) / 标准差',W*0.5,baseY+56,{size:20,color:C.muted});

  /* 逐阶段绘制 */
  const fadeSec=0.7;
  stages.forEach((s)=>{
    if(t<s.a-fadeSec||t>s.b+fadeSec)return;
    const fin=cl(t,s.a,s.a+fadeSec);
    const fout=1-cl(t,s.b,s.b+fadeSec);
    const a=easeOut(fin)*fout;
    if(a<=0.004)return;
    const up=easeOut(cl(t,s.a,s.a+1.6));
    ctx.save();
    ctx.translate(0,(1-up)*24);
    histDraw(s.n,a,'#58C4DD');
    ctx.restore();
  });

  /* n≥20 后叠加理论正态虚线 */
  const nc=cl(t,58.0,61.0);
  if(nc>0){
    normalCurve(nc,'#FFD93D');
    text('标准正态曲线  e^(−z²/2)',W*0.80,H*0.20,{size:22,color:C.yellow,alpha:easeOut(cl(t,59.5,62.0)),align:'right'});
  }

  /* 顶部标题（42 / 28 现行字号） */
  text('一颗骰子，如何生出钟形',72,96,{size:42,weight:700,align:'left'});
  let cap='';
  for(const s of stages){if(t>=s.a&&t<=s.b+fadeSec){cap=s.cap;break;}}
  if(cap)text(cap,72,150,{size:28,align:'left',color:'#EAEAEA'});

  /* 右下计数 */
  let curN=0;
  for(const s of stages){if(t>=s.a&&t<=s.b+fadeSec){curN=s.n;break;}}
  if(curN){
    text('骰子个数',W-72,H*0.86,{size:20,color:C.muted,align:'right'});
    text('n = '+curN,W-72,H*0.925,{size:44,weight:700,align:'right',color:C.blue});
  }

  /* 结语 */
  const s1=cl(t,66.5,69.0);
  if(s1>0){
    ctx.save();ctx.fillStyle='rgba(10,10,15,'+(1*easeOut(s1)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);ctx.restore();
    text('加法，把平坦磨成了钟形',W/2,H*0.44,{size:46,weight:700,alpha:easeOut(s1),blur:16});
    text('但骰子是我挑的——换一个起点还成立吗？',W/2,H*0.56,{size:26,color:C.yellow,alpha:easeOut(cl(t,68.0,70.5))});
  }
}

function setFrame(n){frame=n;draw();}
const state={last:0};let playFrame=0;
function loop(ts){
  const dt=state.last?Math.min((ts-state.last)/1000,0.05):0.016;state.last=ts;
  playFrame+=dt*FPS;
  if(playFrame>TOTAL+60)playFrame=0;
  setFrame(Math.floor(playFrame));
  requestAnimationFrame(loop);
}
document.getElementById('reset').addEventListener('click',()=>{playFrame=0;setFrame(0);});

const EXPORT_MODE=new URLSearchParams(location.search).get('export')==='1';
if(EXPORT_MODE){
  const s=document.getElementById('stage');
  s.style.width='1920px';s.style.maxWidth='none';s.style.height='1080px';
  s.style.aspectRatio='auto';s.style.border='none';s.style.borderRadius='0';s.style.boxShadow='none';
  document.body.style.margin='0';
  document.getElementById('controls').style.display='none';
  document.querySelector('.tag').style.display='none';
  resize();window.__renderFrame=(n)=>{setFrame(n);};setFrame(0);
}else{requestAnimationFrame(loop);}
</script>
</body>
</html>
