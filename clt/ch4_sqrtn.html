<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中心极限定理 · 根号 n</title>
<style>
  :root{--bg:#0A0A0F;--blue:#58C4DD;--green:#83C167;--yellow:#FFD93D;--red:#FF6B6B;--text:#EAEAEA;--muted:#8a8a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"JetBrains Mono","SF Mono","Consolas",monospace;color:var(--text);}
  #stage{width:960px;max-width:96vw;aspect-ratio:16/9;position:relative;background:radial-gradient(120% 120% at 50% 0%, #14142a 0%, var(--bg) 60%);border:1px solid #23233a;border-radius:14px;overflow:hidden;box-shadow:0 0 80px rgba(88,196,221,0.10);}
  canvas{display:block;width:100%;height:100%;}
  .tag{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:2px;color:var(--muted);}
  .tag em{color:var(--blue);font-style:normal;}
  #controls{margin-top:18px;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);}
  button{font-family:inherit;font-size:12px;letter-spacing:1px;background:#1a1a28;color:var(--text);border:1px solid #2c2c44;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.2s;}
  button:hover{background:#23233a;border-color:var(--blue);}
</style>
</head>
<body>
  <div id="stage">
    <div class="tag"><em>■</em> CH4 / 根号 n</div>
    <canvas id="cv"></canvas>
  </div>
  <div id="controls"><button id="reset">↺ 重播</button></div>

<script>
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);let W=960,H=540;
function resize(){
  const s=document.getElementById('stage');const r=s.getBoundingClientRect();
  W=Math.round(r.width)||960;H=Math.round(r.height)||540;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

const FPS=30, TOTAL=2430;
let frame=0;
const cl=(v,a=0,b=1)=>Math.min(1,Math.max(0,(v-a)/(b-a)));
const easeOut=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const C={bg:'#0A0A0F',blue:'#58C4DD',green:'#83C167',yellow:'#FFD93D',red:'#FF6B6B',text:'#EAEAEA',muted:'#8a8a9a'};

function text(str,x,y,o){
  o=o||{};
  const size=o.size||24,color=o.color||C.text,weight=o.weight||500,
        align=o.align||'center',baseline=o.baseline||'middle',
        alpha=(o.alpha===undefined?1:o.alpha),blur=o.blur||0;
  if(alpha<=0.002)return;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.font=weight+' '+size+'px "JetBrains Mono","Consolas",monospace';
  ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=baseline;
  if(blur){ctx.shadowColor=color;ctx.shadowBlur=blur;}
  ctx.fillText(str,x,y);ctx.restore();
}

/* 三条曲线：n = 1 / 4 / 16，σ = 1/√n */
const NS=[1,4,16];
const COLORS=['#FF6B6B','#FFD93D','#58C4DD'];

const AX_Y=H*0.74;
function axis(){ return {x0:W*0.10,x1:W*0.90,y:H*0.74}; }

function drawCurve(n,u,alpha,color,lw,glow){
  const A=axis();
  const baseY=A.y, maxH=H*0.40;
  const s=1/Math.sqrt(n);
  const sEff=Math.pow(s,1-u);
  const k=Math.pow(4,u);
  const peakRef=1/(0.25*Math.sqrt(2*Math.PI));
  const base=(H*0.40)/peakRef;
  const zx=z=>lerp(A.x0,A.x1,(z+3)/6);

  ctx.save();ctx.globalAlpha=alpha;
  ctx.beginPath();
  let started=false;
  for(let i=0;i<=320;i++){
    const z=-3+6*i/320;
    const dens=base*k*(1/sEff)*Math.exp(-z*z/(2*sEff*sEff))/(Math.sqrt(2*Math.PI));
    const y=baseY-dens;
    if(y<0)continue;
    if(!started){ctx.moveTo(zx(z),y);started=true;}
    else ctx.lineTo(zx(z),y);
  }
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}
  ctx.stroke();
  ctx.restore();
}

function draw(){
  const t=frame/FPS;
  ctx.clearRect(0,0,W,H);

  if(t<5.8){
    const a=easeOut(cl(t,0.3,1.5))*(1-cl(t,4.8,5.8));
    text('第 四 章',W/2,H*0.38,{size:26,color:C.blue,alpha:a});
    text('那根根号，值多少钱',W/2,H*0.48,{size:56,weight:700,alpha:a,blur:18});
    text('n 变大，分布不只变「像」，还变「窄」',W/2,H*0.59,{size:24,color:C.muted,alpha:easeOut(cl(t,1.6,3.0))*(1-cl(t,4.8,5.8))});
    return;
  }

  const A=axis();
  const maxH=H*0.40;

  /* 坐标轴 */
  ctx.save();
  ctx.strokeStyle='rgba(180,180,210,0.32)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(A.x0,A.y);ctx.lineTo(A.x1,A.y);ctx.stroke();
  ctx.font='500 19px "JetBrains Mono",monospace';
  ctx.fillStyle='rgba(200,200,220,0.7)';ctx.textAlign='center';ctx.textBaseline='top';
  for(let z=-3;z<=3;z++){
    const x=lerp(A.x0,A.x1,(z+3)/6);
    ctx.beginPath();ctx.moveTo(x,A.y);ctx.lineTo(x,A.y+7);
    ctx.strokeStyle='rgba(180,180,210,0.4)';ctx.stroke();
    ctx.fillText(z===0?'0':(z>0?'+'+z:String(z)),x,A.y+14);
  }
  ctx.restore();

  /* 标准化进度 */
  const u=easeIO(cl(t,38.0,52.0));

  /* 三条曲线 */
  const appear=[7.0,14.0,21.0];
  NS.forEach((n,i)=>{
    const app=easeOut(cl(t,appear[i],appear[i]+1.8));
    if(app<=0.002)return;
    const mixC=(u>0.55)?'#58C4DD':COLORS[i];
    drawCurve(n,u,app*(1-u*0.35),mixC,3.6,14);
  });

  /* 宽度标尺 */
  const rulerA=cl(t,25.0,28.0)*(1-cl(t,37.0,39.5));
  if(rulerA>0&&u<0.05){
    NS.forEach((n,i)=>{
      const s=1/Math.sqrt(n);
      const cx=lerp(A.x0,A.x1,0.5);
      const cxL=lerp(A.x0,A.x1,-s/6+0.5);
      const y=A.y+66+i*44;
      ctx.save();ctx.globalAlpha=rulerA*0.9;
      ctx.strokeStyle=COLORS[i];ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cxL,y);ctx.lineTo(cx+(cx-cxL),y);ctx.stroke();
      // 端点
      ctx.beginPath();ctx.moveTo(cxL,y-6);ctx.lineTo(cxL,y+6);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+(cx-cxL),y-6);ctx.lineTo(cx+(cx-cxL),y+6);ctx.stroke();
      ctx.restore();
      const label='n = '+n+'   宽度 = σ / '+(n===1?'1':n===4?'2':'4');
      text(label,cx,y-17,{size:19,color:COLORS[i],align:'center',alpha:rulerA});
    });
  }

  /* 顶部标题 */
  text('那根根号，值多少钱',72,96,{size:42,weight:700,align:'left'});
  let cap='样本均值的分布：越来越窄';
  if(t<7)cap='先从 n = 1 开始（就是一个样本）';
  if(t>26&&t<39)cap='n 翻 4 倍，宽度只减一半——这就是 √n';
  if(t>=39&&u<0.99)cap='把每条曲线除以自己的宽度……';
  if(u>0.99)cap='全部重合：同一个标准正态分布';
  text(cap,72,150,{size:28,align:'left'});

  /* n 标注 */
  if(t>7&&u<0.6){
    NS.forEach((n,i)=>{
      const a=easeOut(cl(t,appear[i]+0.8,appear[i]+2.0))*(1-cl(t,39,41));
      if(a<=0)return;
      text('n = '+n,W*0.92,H*0.24+i*0.062*H,{size:26,color:COLORS[i],align:'right',alpha:a,weight:700});
    });
  }

  /* 公式 */
  const f1=cl(t,52.0,55.0), f2=cl(t,56.0,59.0), f3=cl(t,60.0,63.0);
  if(f1>0){
    text('( x̄ − μ ) / ( σ / √n )',W*0.5,H*0.855,{size:44,weight:700,align:'center',alpha:easeOut(f1),blur:10});
  }
  if(f2>0){
    text('⟶   N( 0 , 1 )',W*0.5,H*0.925,{size:36,color:C.yellow,align:'center',alpha:easeOut(f2)});
  }
  if(f3>0){
    text('样本量 ×4  →  波动 ÷2',W*0.5,H*0.20,{size:30,color:C.green,align:'center',alpha:easeOut(f3)});
  }

  /* 结语 */
  const s1=cl(t,70.0,72.5);
  if(s1>0){
    ctx.save();ctx.fillStyle='rgba(10,10,15,'+(1*easeOut(s1)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);ctx.restore();
    text('想要结果精确一倍',W/2,H*0.38,{size:34,color:C.muted,alpha:easeOut(cl(t,70.3,72.2))});
    text('得把样本量翻四倍',W/2,H*0.49,{size:50,weight:700,alpha:easeOut(s1),blur:16});
    text('这条成本曲线，比定理本身更常被用到',W/2,H*0.62,{size:24,color:C.blue,alpha:easeOut(cl(t,73.0,75.5))});
  }
}

function setFrame(n){frame=n;draw();}
const state={last:0};let playFrame=0;
function loop(ts){
  const dt=state.last?Math.min((ts-state.last)/1000,0.05):0.016;state.last=ts;
  playFrame+=dt*FPS;
  if(playFrame>TOTAL+60)playFrame=0;
  setFrame(Math.floor(playFrame));
  requestAnimationFrame(loop);
}
document.getElementById('reset').addEventListener('click',()=>{playFrame=0;setFrame(0);});

const EXPORT_MODE=new URLSearchParams(location.search).get('export')==='1';
if(EXPORT_MODE){
  const s=document.getElementById('stage');
  s.style.width='1920px';s.style.maxWidth='none';s.style.height='1080px';
  s.style.aspectRatio='auto';s.style.border='none';s.style.borderRadius='0';s.style.boxShadow='none';
  document.body.style.margin='0';
  document.getElementById('controls').style.display='none';
  document.querySelector('.tag').style.display='none';
  resize();window.__renderFrame=(n)=>{setFrame(n);};setFrame(0);
}else{requestAnimationFrame(loop);}
</script>
</body>
</html>
