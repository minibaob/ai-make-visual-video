<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你被极限的定义骗了整个高中</title>
<style>
  :root{--bg:#0A0A0F;--blue:#58C4DD;--green:#83C167;--yellow:#FFD93D;--red:#FF6B6B;--text:#EAEAEA;--muted:#8a8a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"JetBrains Mono","SF Mono","Consolas",monospace;color:var(--text);}
  #stage{width:960px;max-width:96vw;aspect-ratio:16/9;position:relative;background:radial-gradient(120% 120% at 50% 0%, #14142a 0%, var(--bg) 60%);border:1px solid #23233a;border-radius:14px;overflow:hidden;box-shadow:0 0 80px rgba(88,196,221,0.10);}
  canvas{display:block;width:100%;height:100%;}
  .tag{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:2px;color:var(--muted);}
  .tag em{color:var(--blue);font-style:normal;}
  #controls{margin-top:18px;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);}
  button{font-family:inherit;font-size:12px;letter-spacing:1px;background:#1a1a28;color:var(--text);border:1px solid #2c2c44;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.2s;}
  button:hover{background:#23233a;border-color:var(--blue);}
</style>
</head>
<body>
  <div id="stage">
    <div class="tag"><em>■</em> EPSILON-DELTA / 极限的定义</div>
    <canvas id="cv"></canvas>
  </div>
  <div id="controls"><button id="reset">↺ 重播</button></div>

<script>
const cv=document.getElementById('cv'); const ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2); let W=960,H=540;
function resize(){const s=document.getElementById('stage');const r=s.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

const FPS=30;
const INTRO_END=75, P0_END=180, P1_END=300, P2_END=430, OUTRO_END=510;
let frame=0;

// 世界坐标
const XMIN=-3.2, XMAX=3.2, YMIN=-0.5, YMAX=2.5;
function f(x){ return 1 + 0.5*Math.sin(3*x) + 0.3*x; }  // 有波动但 x->0 时 -> 1
const a = 0;   // x -> 0
const L = f(a); // 极限值 = 1
function px(x){ return (x-XMIN)/(XMAX-XMIN)*W; }
function py(y){ return (YMAX-y)/(YMAX-YMIN)*H; }

function setFrame(n){ frame=n; draw(); }
const state={last:0};
function loop(ts){const dt=state.last?Math.min((ts-state.last)/1000,0.05):0.016;state.last=ts;frame+=dt*FPS;if(frame>OUTRO_END+30)frame=0;setFrame(Math.floor(frame));requestAnimationFrame(loop);}

// ε 随阶段变化：P0 固定展示 ε 带，P1 展示"给 ε 找 δ"，P2 展示 ε 任意小
function epsilon(){
  if(frame < INTRO_END) return 0.4;
  if(frame < P0_END) return 0.4;
  // P1: ε 从 0.4 收到 0.12（演示"任给 ε"）
  if(frame < P1_END) return 0.4 - (frame-P0_END)/(P1_END-P0_END)*0.28;
  // P2: 继续收到 0.05
  return 0.12 - (frame-P1_END)/(P2_END-P1_END)*0.07;
}
// δ 相应缩小
function delta(){
  const e = epsilon();
  return e * 0.6;  // 简化：δ 与 ε 成正比
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // 网格
  ctx.save(); ctx.strokeStyle='rgba(140,140,180,0.12)'; ctx.lineWidth=1;
  for(let x=Math.ceil(XMIN); x<=XMAX; x++){ if(Math.abs(x)<1e-6)continue; ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),H);ctx.stroke(); }
  for(let y=Math.ceil(YMIN); y<=YMAX; y++){ ctx.beginPath();ctx.moveTo(0,py(y));ctx.lineTo(W,py(y));ctx.stroke(); }
  ctx.strokeStyle='rgba(180,180,210,0.35)'; ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(px(0),0);ctx.lineTo(px(0),H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,py(0));ctx.lineTo(W,py(0));ctx.stroke();
  ctx.restore();

  // 曲线
  ctx.save(); ctx.strokeStyle='#58C4DD'; ctx.lineWidth=4; ctx.lineJoin='round';
  ctx.shadowColor='rgba(88,196,221,0.5)'; ctx.shadowBlur=12;
  ctx.beginPath(); const N=400;
  for(let i=0;i<=N;i++){const x=XMIN+(XMAX-XMIN)*i/N;const yy=py(f(x));if(i===0)ctx.moveTo(px(x),yy);else ctx.lineTo(px(x),yy);}
  ctx.stroke(); ctx.restore();

  // 极限点 (a, L)
  const axp=px(a), lyp=py(L);

  // ε 带（水平黄带，L±ε）
  ctx.save();
  ctx.fillStyle='rgba(255,217,61,0.12)';
  ctx.fillRect(0, py(L+epsilon()), W, py(L-epsilon())-py(L+epsilon()));
  ctx.strokeStyle='rgba(255,217,61,0.6)'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(0,py(L+epsilon())); ctx.lineTo(W,py(L+epsilon())); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,py(L-epsilon())); ctx.lineTo(W,py(L-epsilon())); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#FFD93D'; ctx.font='500 15px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(`ε = ${epsilon().toFixed(3)}`, 12, py(L+epsilon())-6);
  ctx.restore();

  // δ 带（垂直蓝带，a±δ）
  ctx.save();
  ctx.fillStyle='rgba(88,196,221,0.10)';
  ctx.fillRect(px(a-delta()), 0, px(a+delta())-px(a-delta()), H);
  ctx.strokeStyle='rgba(88,196,221,0.6)'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(px(a-delta()),0); ctx.lineTo(px(a-delta()),H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px(a+delta()),0); ctx.lineTo(px(a+delta()),H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#58C4DD'; ctx.font='500 15px "JetBrains Mono",monospace';
  ctx.fillText(`δ = ${delta().toFixed(3)}`, px(a+delta())+6, py(2.4));
  ctx.restore();

  // 交点十字（a, L）和空心点
  ctx.save();
  ctx.fillStyle='#FFD93D'; ctx.shadowColor='#FFD93D'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(axp,lyp,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(axp,lyp,10,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='500 14px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText('L', axp+14, lyp-10);
  ctx.restore();

  // 顶部文字
  ctx.save(); ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.font='600 20px "JetBrains Mono",monospace';
  ctx.fillText('极限：x→0 时 f(x) 无限接近 L', 20, 46);
  ctx.font='500 17px "JetBrains Mono",monospace';
  if(frame<INTRO_END){ ctx.fillStyle='#EAEAEA'; ctx.fillText('“无限接近”到底是什么？', 20, 74); }
  else if(frame<P0_END){ ctx.fillStyle='#FFD93D'; ctx.fillText('任给一个 ε，都能找到一个 δ', 20, 74); }
  else if(frame<P1_END){ ctx.fillStyle='#FFD93D'; ctx.fillText('ε 变小，δ 也跟着变小', 20, 74); }
  else { ctx.fillStyle='#83C167'; ctx.fillText('ε 可以任意小 —— 这才是“接近”的真正含义', 20, 74); }
  ctx.restore();

  if(frame<INTRO_END) drawIntro(frame/INTRO_END);
  if(frame>=P2_END) drawOutro((frame-P2_END)/(OUTRO_END-P2_END));
}

function drawIntro(t){
  ctx.save(); ctx.fillStyle='#0A0A0F'; ctx.fillRect(0,0,W,H);
  const ease=t<0.25?0:Math.min(1,(t-0.25)/0.5); ctx.globalAlpha=ease;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#58C4DD'; ctx.font='500 22px "JetBrains Mono",monospace';
  ctx.fillText('极 限 · 真 正 的 定 义', W/2, H*0.36);
  ctx.fillStyle='#FFFFFF'; ctx.font='700 52px "JetBrains Mono",monospace';
  ctx.fillText('你以为的“无限接近”，', W/2, H*0.48);
  ctx.fillStyle='#FFD93D';
  ctx.fillText('高 中 根 本 没 讲 清', W/2, H*0.48+68);
  ctx.restore();
}
function drawOutro(t){
  ctx.save();
  const grad=ctx.createLinearGradient(0,H*0.35,0,H);
  grad.addColorStop(0,'rgba(10,10,15,0)');grad.addColorStop(1,'rgba(10,10,15,0.92)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  const ease=Math.min(1,t/0.3);ctx.globalAlpha=ease;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#FFFFFF';ctx.font='700 40px "JetBrains Mono",monospace';
  ctx.fillText('∀ ε>0，∃ δ>0', W/2, H*0.70);
  ctx.fillStyle='#83C167';ctx.font='500 26px "JetBrains Mono",monospace';
  ctx.fillText('0<|x−a|<δ ⟹ |f(x)−L|<ε', W/2, H*0.70+44);
  ctx.fillStyle='#FFD93D';ctx.font='600 28px "JetBrains Mono",monospace';
  ctx.fillText('这就是极限的全部定义', W/2, H*0.70+98);
  if(t>0.5){ctx.globalAlpha=Math.min(1,(t-0.5)/0.3);ctx.fillStyle='#8a8a9a';ctx.font='500 22px "JetBrains Mono",monospace';ctx.fillText('关注 · 每天一个可视化概念',W/2,H*0.90);}
  ctx.restore();
}

document.getElementById('reset').addEventListener('click',()=>setFrame(0));

const EXPORT_MODE=new URLSearchParams(location.search).get('export')==='1';
if(EXPORT_MODE){
  const s=document.getElementById('stage');s.style.width='1920px';s.style.maxWidth='none';s.style.height='1080px';s.style.aspectRatio='auto';s.style.border='none';s.style.borderRadius='0';s.style.boxShadow='none';
  document.body.style.margin='0';document.getElementById('controls').style.display='none';document.querySelector('.tag').style.display='none';
  resize();window.__renderFrame=(n)=>{setFrame(n);};setFrame(0);
}else{requestAnimationFrame(loop);}
</script>
</body>
</html>
