<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>精修封面生成器</title>
<style>
  :root{--bg:#0A0A0F;--blue:#58C4DD;--green:#83C167;--yellow:#FFD93D;--red:#FF6B6B;--text:#EAEAEA;--muted:#8a8a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #cover{position:relative;overflow:hidden;background:radial-gradient(140% 120% at 50% 0%, #181834 0%, var(--bg) 58%);}
  canvas{position:absolute;top:0;left:0;display:block;}
  .txt{position:absolute;font-family:"JetBrains Mono","PingFang SC","Microsoft YaHei",sans-serif;}
</style>
</head>
<body>
  <div id="cover">
    <canvas id="cv"></canvas>
    <div class="txt" id="kicker"></div>
    <div class="txt" id="title"></div>
    <div class="txt" id="sub"></div>
    <div class="txt" id="formula"></div>
    <div class="txt" id="cta"></div>
  </div>
<script>
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
const params=new URLSearchParams(location.search);
const topic=params.get('t')||'lie';
const size=params.get('size')||'43';  // 43=横版4:3, 916=竖版9:16
const W = size==='916' ? 1080 : 1440;
const H = size==='916' ? 1920 : 1080;
cv.width=W; cv.height=H;
// 关键：给 #cover 容器设置明确尺寸（否则容器 0x0，内容被 overflow:hidden 裁掉）
const coverEl=document.getElementById('cover');
coverEl.style.width=W+'px';
coverEl.style.height=H+'px';

const isLand = (size==='43'); // 4:3 是横版（文字左图形右），9:16 是竖版（文字上图形下）

// ===== 选题配置 =====
const TOPICS = {
  tangent: {
    kicker:'导 数 · 几 何 意 义',
    title:['导数就是','<hl>切线的斜率</hl>'],
    sub:'割线无限逼近切线的那一瞬间',
    formula:'f′(x) = lim [f(x+h)−f(x)] / h',
    draw:drawTangent
  },
  lie: {
    kicker:'微 分 · 真 相',
    title:['微分的核心','是一个 <hl>「谎言」</hl>'],
    sub:'直线近似曲线，放大到足够小却惊人地准',
    formula:'f(x) ≈ f(a) + f′(a)(x−a)',
    draw:drawLie
  },
  limit: {
    kicker:'极 限 · 真 正 的 定 义',
    title:['你被极限的定义','<hl>骗了整个高中</hl>'],
    sub:'「无限接近」原来可以被精确刻画',
    formula:'∀ ε > 0,  ∃ δ > 0',
    draw:drawLimit
  },
  e: {
    kicker:'数 学 常 数 · e',
    title:['e 为什么是','<hl>复利之王</hl>'],
    sub:'复利无限细分，收敛到一个神秘常数',
    formula:'e = lim (1 + 1/n)ⁿ  (n→∞)',
    draw:drawE
  },
  sin: {
    kicker:'三 角 函 数 · 导 数',
    title:['sin 的导数','<hl>藏在单位圆里</hl>'],
    sub:'速度的竖直分量，写下了这个公式',
    formula:'d/dx sin(x) = cos(x)',
    draw:drawSin
  },
  zoom: {
    kicker:'放 大 · 微 分 的 几 何 直 觉',
    title:['为什么放大后','<hl>曲线变直了</hl>'],
    sub:'无限逼近时，曲线 ≈ 切线',
    formula:'误差 → 0（局部线性）',
    draw:drawZoom
  },
  weierstrass: {
    kicker:'数 学 怪 物 · 分 形',
    title:['处处连续','<hl>却处处不可导</hl>'],
    sub:'放大任何一处，全是尖角',
    formula:'f(x) = Σ 0.5ⁿ · cos(3ⁿπx)',
    draw:drawWeierstrass
  },
  fourier: {
    kicker:'傅 里 叶 · 分 解',
    title:['任何波形','<hl>都是一堆正弦波</hl>'],
    sub:'叠加的正弦越多，越接近方波',
    formula:'方波 = (4/π)·Σ sin(nx)/n',
    draw:drawFourier
  },
  calculus: {
    kicker:'微 积 分 · 完 整 直 觉',
    title:['微积分到底','<hl>在解决什么</hl>'],
    sub:'从切线到积分，一种思想统一了两件事',
    formula:'微分 ↹ 积分（互逆）',
    draw:drawCalculus
  }
};
const T=TOPICS[topic];

// ===== 文字布局 =====
function setupText(){
  const kicker=document.getElementById('kicker');
  const title=document.getElementById('title');
  const sub=document.getElementById('sub');
  const formula=document.getElementById('formula');
  const cta=document.getElementById('cta');

  kicker.textContent=T.kicker;
  title.innerHTML=T.title.join('<br>');
  sub.textContent=T.sub;
  formula.innerHTML=T.formula;
  cta.innerHTML='<span>每天一个可视化概念</span>';

  if(isLand){
    kicker.style.cssText=`left:70px;top:160px;font-size:26px;letter-spacing:7px;color:var(--blue);font-weight:600;`;
    title.style.cssText=`left:70px;top:225px;font-size:88px;font-weight:900;color:#fff;line-height:1.18;text-shadow:0 4px 30px rgba(0,0,0,.6);`;
    title.querySelectorAll('hl').forEach(e=>e.style.color='var(--yellow)');
    sub.style.cssText=`left:70px;top:540px;font-size:30px;color:var(--text);letter-spacing:2px;`;
    formula.style.cssText=`left:70px;top:630px;font-size:36px;color:var(--green);font-weight:700;`;
    cta.style.cssText=`left:70px;bottom:80px;`;
    cta.querySelector('span').style.cssText=`display:inline-block;font-size:26px;letter-spacing:3px;color:var(--yellow);font-weight:700;background:rgba(10,10,15,0.9);padding:15px 40px;border-radius:50px;border:2px solid var(--yellow);box-shadow:0 0 40px rgba(255,217,61,.25);`;
  } else {
    // 竖版 9:16：文字在上半，图形在下半
    kicker.style.cssText=`left:0;right:0;top:180px;text-align:center;font-size:34px;letter-spacing:10px;color:var(--blue);font-weight:600;`;
    title.style.cssText=`left:0;right:0;top:300px;text-align:center;font-size:100px;font-weight:900;color:#fff;line-height:1.18;text-shadow:0 4px 30px rgba(0,0,0,.6);`;
    title.querySelectorAll('hl').forEach(e=>e.style.color='var(--yellow)');
    sub.style.cssText=`left:0;right:0;top:720px;text-align:center;font-size:40px;color:var(--text);letter-spacing:2px;`;
    formula.style.cssText=`left:0;right:0;top:850px;text-align:center;font-size:42px;color:var(--green);font-weight:700;`;
    cta.style.cssText=`left:0;right:0;bottom:110px;text-align:center;`;
    cta.querySelector('span').style.cssText=`display:inline-block;font-size:28px;letter-spacing:3px;color:var(--yellow);font-weight:700;background:rgba(10,10,15,0.9);padding:16px 44px;border-radius:50px;border:2px solid var(--yellow);box-shadow:0 0 40px rgba(255,217,61,.25);`;
  }
}
setupText();

// ===== 通用工具 =====
function drawGrid(gx,gy,span,scale){
  ctx.save();
  ctx.strokeStyle='rgba(140,140,180,0.10)';ctx.lineWidth=1;
  for(let i=-6;i<=6;i++){const xx=gx+i*scale*span/6;ctx.beginPath();ctx.moveTo(xx,gy-3*scale);ctx.lineTo(xx,gy+3*scale);ctx.stroke();}
  for(let i=-6;i<=6;i++){const yy=gy+i*scale*span/6;ctx.beginPath();ctx.moveTo(gx-3*scale, yy);ctx.lineTo(gx+3*scale,yy);ctx.stroke();}
  ctx.strokeStyle='rgba(180,180,210,0.30)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(gx-3.5*scale,gy);ctx.lineTo(gx+3.5*scale,gy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gx,gy-3.5*scale);ctx.lineTo(gx,gy+3.5*scale);ctx.stroke();
  ctx.restore();
}
function line(pxx,pyy,sl,color,width){
  const long=3000,dx=long/Math.sqrt(1+sl*sl),dy=sl*dx;
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
  if(color.includes('255,217,61')){ctx.shadowColor='rgba(255,217,61,0.5)';ctx.shadowBlur=16;}
  if(color.includes('255,107,107')){ctx.shadowColor='rgba(255,107,107,0.4)';ctx.shadowBlur=12;}
  ctx.beginPath();ctx.moveTo(pxx-dx,pyy+dy);ctx.lineTo(pxx+dx,pyy-dy);ctx.stroke();ctx.restore();
}
function dot(pxx,pyy,color,r){
  ctx.save();ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(pxx,pyy,r,0,Math.PI*2);ctx.fill();ctx.restore();
}

// ===== 选题1：微分谎言（抛物线 + 切线 + Δx/Δy）=====
function drawLie(){
  const gx=isLand?W*0.68:W*0.5, gy=isLand?H*0.55:H*0.72, scale=isLand?H*0.34:W*0.40;
  const XMIN=-1.8,XMAX=1.8;
  function f(x){return x*x;}
  function fp(x){return 2*x;}
  function P(x,y){return [gx + (x-XMIN)/(XMAX-XMIN)*2*scale*0.5*3.6/1.8*0.5, gy - y/(1.8*1.8)*scale*1.2];}
  drawGrid(gx,gy,1.8,scale);
  // 曲线
  ctx.save();ctx.strokeStyle='#58C4DD';ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.shadowColor='rgba(88,196,221,0.6)';ctx.shadowBlur=24;ctx.beginPath();
  for(let i=0;i<=300;i++){const x=XMIN+(XMAX-XMIN)*i/300;const [a,b]=P(x,f(x));if(i===0)ctx.moveTo(a,b);else ctx.lineTo(a,b);}
  ctx.stroke();ctx.restore();
  // 切点
  const ax=0.8;const [tx,ty]=P(ax,f(ax));const slope=fp(ax);
  line(tx,ty,slope,'rgba(255,217,61,0.95)',6);
  dot(tx,ty,'#FFD93D',12);
  // Δx/Δy 三角形
  ctx.save();const run=70,rise=slope*run;
  ctx.strokeStyle='rgba(255,217,61,0.85)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+run,ty);ctx.lineTo(tx+run,ty-rise);ctx.stroke();
  ctx.fillStyle='rgba(255,217,61,0.95)';ctx.font='700 26px "JetBrains Mono",monospace';
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('Δy',tx+run+14,ty-rise/2);
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText('Δx',tx+run/2,ty+10);
  ctx.restore();
  // P 标注（移到切点左上方，避开曲线）
  ctx.save();ctx.fillStyle='#FFD93D';ctx.font='700 28px "JetBrains Mono",monospace';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('P',tx-14,ty-14);ctx.restore();
}

// ===== 选题2：极限 ε-δ =====
function drawLimit(){
  const gx=isLand?W*0.68:W*0.5, gy=isLand?H*0.55:H*0.72, scale=isLand?H*0.34:W*0.40;
  drawGrid(gx,gy,2.2,scale);
  function f(x){return 1+0.5*Math.sin(3*x)+0.3*x;}
  function P(x,y){return [gx+x/2.2*scale, gy-y/2.2*scale];}
  // ε 带（黄）
  const eps=0.4;
  ctx.save();
  ctx.fillStyle='rgba(255,217,61,0.14)';
  ctx.fillRect(gx-2.2/2.2*scale*1.1, P(0,1+eps)[1], 2.2*scale, P(0,1-eps)[1]-P(0,1+eps)[1]);
  ctx.strokeStyle='rgba(255,217,61,0.7)';ctx.lineWidth=2;ctx.setLineDash([8,6]);
  ctx.strokeRect(gx-2.2/2.2*scale*1.1, P(0,1+eps)[1], 2.2*scale, P(0,1-eps)[1]-P(0,1+eps)[1]);
  ctx.setLineDash([]);
  ctx.fillStyle='#FFD93D';ctx.font='600 20px "JetBrains Mono",monospace';ctx.textAlign='left';
  ctx.fillText('ε', gx-2.2/2.2*scale*1.1+8, P(0,1+eps)[1]-8);
  ctx.restore();
  // δ 带（蓝）
  const delta=0.24;
  ctx.save();
  ctx.fillStyle='rgba(88,196,221,0.12)';
  ctx.fillRect(P(-delta,0)[0], gy-2.2/2.2*scale*1.1, P(delta,0)[0]-P(-delta,0)[0], 2.2*scale);
  ctx.strokeStyle='rgba(88,196,221,0.7)';ctx.lineWidth=2;ctx.setLineDash([8,6]);
  ctx.strokeRect(P(-delta,0)[0], gy-2.2/2.2*scale*1.1, P(delta,0)[0]-P(-delta,0)[0], 2.2*scale);
  ctx.setLineDash([]);
  ctx.fillStyle='#58C4DD';ctx.font='600 20px "JetBrains Mono",monospace';ctx.textAlign='left';
  ctx.fillText('δ', P(delta,0)[0]+6, gy+2.2/2.2*scale*1.1-10);
  ctx.restore();
  // 曲线
  ctx.save();ctx.strokeStyle='#58C4DD';ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.shadowColor='rgba(88,196,221,0.6)';ctx.shadowBlur=24;ctx.beginPath();
  for(let i=0;i<=300;i++){const x=-2.2+4.4*i/300;const [a,b]=P(x,f(x));if(i===0)ctx.moveTo(a,b);else ctx.lineTo(a,b);}
  ctx.stroke();ctx.restore();
  // 极限点
  const [lx,ly]=P(0,1);
  ctx.save();ctx.fillStyle='#FFD93D';ctx.shadowColor='#FFD93D';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(lx,ly,10,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(lx,ly,16,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='700 24px "JetBrains Mono",monospace';ctx.textAlign='left';
  ctx.fillText('L',lx+20,ly-12);ctx.restore();
}

// ===== 选题3：e 复利 =====
function drawE(){
  const gx=isLand?W*0.68:W*0.5, gy=isLand?H*0.55:H*0.72, scale=isLand?H*0.34:W*0.40;
  const xMin=1, xMax=200; // 扩大到 200，让曲线末端真正逼近 e
  function f(x){return Math.pow(1+1/x,x);}
  function Px(lg){return gx + (lg-Math.log(xMin))/(Math.log(xMax)-Math.log(xMin))*scale*2.4 - scale*1.2;}
  function Py(y){return gy - (y-2)/(Math.E-2)*scale*0.9 - scale*0.2;}
  drawGrid(gx,gy,2.5,scale);
  // e 渐近线
  ctx.save();const yE=Py(Math.E);
  ctx.strokeStyle='rgba(131,193,103,0.8)';ctx.lineWidth=3.5;ctx.setLineDash([10,7]);
  ctx.beginPath();ctx.moveTo(gx-scale*1.4,yE);ctx.lineTo(gx+scale*1.4,yE);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#83C167';ctx.font='700 26px "JetBrains Mono",monospace';ctx.textAlign='left';
  ctx.fillText('e ≈ 2.718', gx+scale*0.35, yE-14);ctx.restore();
  // 增长曲线
  ctx.save();ctx.strokeStyle='#FFD93D';ctx.lineWidth=6;ctx.lineJoin='round';
  ctx.shadowColor='rgba(255,217,61,0.5)';ctx.shadowBlur=18;ctx.beginPath();
  for(let i=0;i<=400;i++){const lg=Math.log(xMin)+(Math.log(xMax)-Math.log(xMin))*i/400;const x=Math.exp(lg);const y=f(x);const cx=Px(lg);const cy=Py(y);if(i===0)ctx.moveTo(cx,cy);else ctx.lineTo(cx,cy);}
  ctx.stroke();ctx.restore();
  // 当前点（曲线末端，几乎触及 e）
  const [ex,ey]=Px(Math.log(xMax));dot(ex,ey,'#FFD93D',13);
  // 末端标注
  ctx.save();ctx.fillStyle='#FFD93D';ctx.font='600 22px "JetBrains Mono",monospace';ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText('(1+1/n)ⁿ', ex-60, ey-10);ctx.restore();
}

// ===== 选题4：sin 单位圆 =====
function drawSin(){
  const gx=isLand?W*0.68:W*0.5, gy=isLand?H*0.55:H*0.72, R=isLand?H*0.36:W*0.42;
  const th=0.7;
  const px=gx+R*Math.cos(th), py=gy-R*Math.sin(th);
  ctx.save();
  // 圆
  ctx.strokeStyle='rgba(200,200,230,0.4)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(gx,gy,R,0,Math.PI*2);ctx.stroke();
  // 坐标轴
  ctx.strokeStyle='rgba(180,180,210,0.3)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(gx-R*1.15,gy);ctx.lineTo(gx+R*1.15,gy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gx,gy-R*1.15);ctx.lineTo(gx,gy+R*1.15);ctx.stroke();
  // sin 竖直投影（黄虚线）
  ctx.strokeStyle='rgba(255,217,61,0.85)';ctx.lineWidth=3.5;ctx.setLineDash([7,6]);
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,gy);ctx.stroke();ctx.setLineDash([]);
  // cos 水平投影（绿虚线）
  ctx.strokeStyle='rgba(131,193,103,0.85)';ctx.lineWidth=3.5;ctx.setLineDash([7,6]);
  ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(px,gy);ctx.stroke();ctx.setLineDash([]);
  // 半径
  ctx.strokeStyle='#58C4DD';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(px,py);ctx.stroke();
  // 角度弧
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(gx,gy,R*0.28,Math.min(0,-th),Math.max(0,-th));ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='600 22px "JetBrains Mono",monospace';ctx.textAlign='left';
  ctx.fillText('θ',gx+R*0.36,gy-R*0.16);
  // 速度向量（红，切线方向）
  const vt=R*0.55,vx=-Math.sin(th),vy=Math.cos(th);
  ctx.strokeStyle='#FF6B6B';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.shadowColor='rgba(255,107,107,0.6)';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+vx*vt,py-vy*vt);ctx.stroke();ctx.shadowBlur=0;
  // 竖直分量（黄虚线 = cos）
  ctx.strokeStyle='#FFD93D';ctx.lineWidth=4;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(px+vx*vt,py);ctx.lineTo(px+vx*vt,py-vy*vt);ctx.stroke();ctx.setLineDash([]);
  // 标注（彻底分开：v 在向量终点右上方，竖直分量标注 = cosθ，即 sin 的导数）
  ctx.fillStyle='#FF6B6B';ctx.font='600 22px "JetBrains Mono",monospace';ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText('v',px+vx*vt+10,py-vy*vt-6);
  ctx.fillStyle='#FFD93D';ctx.textBaseline='middle';
  ctx.fillText('= cosθ',px+vx*vt-12,py-vy*vt/2);
  // 圆上点
  ctx.fillStyle='#FFD93D';ctx.shadowColor='#FFD93D';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(px,py,11,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 底部图例
  ctx.save();
  ctx.fillStyle='#FFD93D';ctx.font='600 22px "JetBrains Mono",monospace';ctx.textAlign='center';
  ctx.fillText('sinθ（高度）',gx,gy+R+48);
  ctx.fillStyle='#83C167';
  ctx.fillText('cosθ（水平）',gx,gy+R+80);
  ctx.restore();
}

// ===== 选题：导数切线（三次函数 + 割线 + 切线 + Δx/Δy）=====
function drawTangent(){
  const gx=isLand?W*0.70:W*0.5, gy=isLand?H*0.52:H*0.72, scale=isLand?H*0.36:W*0.42;
  const XMIN=-2.2,XMAX=2.2;
  function f(x){return x*x*x-2*x;}
  function fp(x){return 3*x*x-2;}
  function P(x,y){return [gx+x/2.2*scale, gy-y/2.2*scale];}
  drawGrid(gx,gy,2.2,scale);
  // 曲线
  ctx.save();ctx.strokeStyle='#58C4DD';ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.shadowColor='rgba(88,196,221,0.6)';ctx.shadowBlur=24;ctx.beginPath();
  for(let i=0;i<=300;i++){const x=XMIN+(XMAX-XMIN)*i/300;const [a,b]=P(x,f(x));if(i===0)ctx.moveTo(a,b);else ctx.lineTo(a,b);}
  ctx.stroke();ctx.restore();
  // 切点 x=0.9
  const ax=0.9;const [tx,ty]=P(ax,f(ax));const slope=fp(ax);
  line(tx,ty,slope,'rgba(255,217,61,0.95)',6);
  dot(tx,ty,'#FFD93D',12);
  // 割线（红，展示逼近关系）
  const h2=0.55;const [sx,sy]=P(ax+h2,f(ax+h2));const secSlope=(f(ax+h2)-f(ax))/h2;
  line(tx,ty,secSlope,'rgba(255,107,107,0.8)',4);
  dot(sx,sy,'#FF6B6B',9);
  // Δx/Δy 三角形
  ctx.save();const run=70,rise=slope*run;
  ctx.strokeStyle='rgba(255,217,61,0.85)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+run,ty);ctx.lineTo(tx+run,ty-rise);ctx.stroke();
  ctx.fillStyle='rgba(255,217,61,0.95)';ctx.font='700 26px "JetBrains Mono",monospace';
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Δy',tx+run+14,ty-rise/2);
  ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Δx',tx+run/2,ty+12);ctx.restore();
  // P 标注（移到切点左上方，与 Δx 错开）
  ctx.save();ctx.fillStyle='#FFD93D';ctx.font='700 28px "JetBrains Mono",monospace';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('P',tx-18,ty-18);ctx.restore();
}

// ===== 选题：放大（曲线 + 切线，展示局部线性）=====
function drawZoom(){
  const gx=isLand?W*0.70:W*0.5, gy=isLand?H*0.52:H*0.72, scale=isLand?H*0.36:W*0.42;
  function f(x){return x*x;}
  function fp(x){return 2*x;}
  function P(x,y){return [gx+x/1.8*scale, gy-y/1.8*scale];}
  drawGrid(gx,gy,1.8,scale);
  // 曲线（画一个小范围，模拟"放大后"的近景）
  ctx.save();ctx.strokeStyle='#58C4DD';ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.shadowColor='rgba(88,196,221,0.6)';ctx.shadowBlur=24;ctx.beginPath();
  for(let i=0;i<=300;i++){const x=-1.5+3*i/300;const [a,b]=P(x,f(x));if(i===0)ctx.moveTo(a,b);else ctx.lineTo(a,b);}
  ctx.stroke();ctx.restore();
  // 切点 x=0.5
  const ax=0.5;const [tx,ty]=P(ax,f(ax));const slope=fp(ax);
  line(tx,ty,slope,'rgba(255,217,61,0.95)',6);
  dot(tx,ty,'#FFD93D',12);
  // 误差虚线（曲线与切线几乎重合）
  const xEdge=0.9;const [cx2,cy2]=P(xEdge,f(xEdge));const cyLine=ty-slope*(xEdge-ax)/1.8*scale;
  ctx.save();ctx.strokeStyle='#FF6B6B';ctx.lineWidth=3;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(cx2,cyLine);ctx.stroke();ctx.setLineDash([]);
  // 误差标注放到图形区左上角（切线斜率为正向右上，左上角是空旷区）
  ctx.fillStyle='#FF8A8A';ctx.font='700 24px "JetBrains Mono",monospace';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('误差 → 0', gx-scale*0.95, gy-scale*1.15);ctx.restore();
  // P 标注
  ctx.save();ctx.fillStyle='#FFD93D';ctx.font='700 28px "JetBrains Mono",monospace';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('P',tx-14,ty-14);ctx.restore();
}

// ===== 选题：魏尔斯特拉斯（毛糙分形曲线）=====
function drawWeierstrass(){
  const gx=isLand?W*0.70:W*0.5, gy=isLand?H*0.52:H*0.72, scale=isLand?H*0.34:W*0.40;
  const XMIN=-1.5,XMAX=1.5;
  function w(x){let s=0;for(let n=0;n<8;n++)s+=Math.pow(0.5,n)*Math.cos(Math.pow(3,n)*Math.PI*x);return s;}
  function P(x,y){return [gx+x/1.5*scale, gy-y/2.2*scale];}
  drawGrid(gx,gy,1.5,scale);
  // 毛糙曲线（高采样）
  ctx.save();ctx.strokeStyle='#58C4DD';ctx.lineWidth=2.5;ctx.lineJoin='round';
  ctx.shadowColor='rgba(88,196,221,0.6)';ctx.shadowBlur=16;ctx.beginPath();
  for(let i=0;i<=1200;i++){const x=XMIN+(XMAX-XMIN)*i/1200;const [a,b]=P(x,w(x));if(i===0)ctx.moveTo(a,b);else ctx.lineTo(a,b);}
  ctx.stroke();ctx.restore();
  // 标注"放大镜"示意：画一个小圆圈+放大符号，强调"处处是尖角"
  ctx.save();
  ctx.strokeStyle='rgba(255,217,61,0.8)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(gx+scale*0.4,gy-scale*0.3,scale*0.22,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gx+scale*0.55,gy-scale*0.15);ctx.lineTo(gx+scale*0.75,gy+scale*0.05);ctx.stroke();
  ctx.fillStyle='#FFD93D';ctx.font='700 26px "JetBrains Mono",monospace';ctx.textAlign='left';
  ctx.fillText('处处是尖角',gx+scale*0.5,gy+scale*0.4);
  ctx.restore();
}

// ===== 选题：傅里叶（方波 + 正弦叠加）=====
function drawFourier(){
  const gx=isLand?W*0.70:W*0.5, gy=isLand?H*0.52:H*0.72, scale=isLand?H*0.34:W*0.40;
  const XMIN=0,XMAX=2*Math.PI;
  function sq(x,terms){let s=0;for(let k=0;k<terms;k++){const n=2*k+1;s+=Math.sin(n*x)/n;}return s*4/Math.PI;}
  function P(x,y){return [gx+(x-XMIN)/(XMAX-XMIN)*2.2*scale-1.1*scale, gy-y/1.5*scale*0.9];}
  drawGrid(gx,gy,2,scale);
  // 目标方波（虚线）
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2.5;ctx.setLineDash([8,6]);
  ctx.beginPath();
  ctx.moveTo(P(0,1)[0],P(0,1)[1]);ctx.lineTo(P(Math.PI,1)[0],P(Math.PI,1)[1]);
  ctx.lineTo(P(Math.PI,-1)[0],P(Math.PI,-1)[1]);ctx.lineTo(P(2*Math.PI,-1)[0],P(2*Math.PI,-1)[1]);
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
  // 叠加曲线（10项，接近方波）
  ctx.save();ctx.strokeStyle='#FFD93D';ctx.lineWidth=4;ctx.lineJoin='round';
  ctx.shadowColor='rgba(255,217,61,0.6)';ctx.shadowBlur=16;ctx.beginPath();
  for(let i=0;i<=600;i++){const x=XMIN+(XMAX-XMIN)*i/600;const [a,b]=P(x,sq(x,10));if(i===0)ctx.moveTo(a,b);else ctx.lineTo(a,b);}
  ctx.stroke();ctx.restore();
  // 标注
  ctx.save();ctx.fillStyle='#FFD93D';ctx.font='700 26px "JetBrains Mono",monospace';ctx.textAlign='left';
  ctx.fillText('方波 = 一堆正弦波', gx+scale*0.2, gy-scale*1.2);
  ctx.restore();
}

// ===== 选题：微积分长视频（微分+积分+等号）=====
function drawCalculus(){
  const gx=isLand?W*0.66:W*0.5, gy=isLand?H*0.52:H*0.72, scale=isLand?H*0.30:W*0.36;
  // 左：曲线+切线（微分）
  const lx=gx-scale*0.7;
  ctx.save();
  ctx.strokeStyle='#58C4DD';ctx.lineWidth=4;ctx.lineJoin='round';ctx.shadowColor='rgba(88,196,221,0.5)';ctx.shadowBlur=12;
  ctx.beginPath();
  for(let i=0;i<=150;i++){const x=-1.2+2.4*i/150;const px=lx+x*scale*0.8;const py=gy-x*x*scale*0.5;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
  // 切线
  const tx=lx+0.5*scale*0.8, ty=gy-0.25*scale*0.5;
  ctx.strokeStyle='#FFD93D';ctx.lineWidth=3.5;
  ctx.beginPath();ctx.moveTo(tx-60,ty+60);ctx.lineTo(tx+60,ty-60);ctx.stroke();
  ctx.fillStyle='#FFD93D';ctx.beginPath();ctx.arc(tx,ty,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFD93D';ctx.font='700 24px "JetBrains Mono",monospace';ctx.textAlign='center';
  ctx.fillText('微分',lx,H*0.16);
  ctx.restore();

  // 右：曲线+面积（积分）
  const rx=gx+scale*0.62;
  ctx.save();
  ctx.strokeStyle='#58C4DD';ctx.lineWidth=4;ctx.lineJoin='round';ctx.shadowColor='rgba(88,196,221,0.5)';ctx.shadowBlur=12;
  ctx.beginPath();
  for(let i=0;i<=150;i++){const x=0+1.0*i/150;const px=rx+x*scale*0.6;const py=gy-x*x*scale*0.45;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
  // 面积填充
  for(let i=0;i<12;i++){const x=i*0.083;const px1=rx+x*scale*0.6;const px2=rx+(x+0.083)*scale*0.6;const pyTop=gy-x*x*scale*0.45;ctx.fillStyle='rgba(131,193,103,0.3)';ctx.fillRect(px1,pyTop,px2-px1,gy-pyTop);}
  ctx.fillStyle='#83C167';ctx.font='700 24px "JetBrains Mono",monospace';ctx.textAlign='center';
  ctx.fillText('积分',rx,H*0.16);
  ctx.restore();

  // 中间等号
  ctx.save();
  ctx.fillStyle='#FFFFFF';ctx.font='700 48px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('=',gx,gy);
  ctx.fillStyle='#FFD93D';ctx.font='700 24px "JetBrains Mono",monospace';
  ctx.fillText('互逆',gx,H*0.82);
  ctx.restore();
}

T.draw();
