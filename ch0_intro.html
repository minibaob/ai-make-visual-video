<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引入：两个老问题</title>
<style>
  :root{--bg:#0A0A0F;--blue:#58C4DD;--green:#83C167;--yellow:#FFD93D;--red:#FF6B6B;--text:#EAEAEA;--muted:#8a8a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"JetBrains Mono","SF Mono","Consolas",monospace;color:var(--text);}
  #stage{width:960px;max-width:96vw;aspect-ratio:16/9;position:relative;background:radial-gradient(120% 120% at 50% 0%, #14142a 0%, var(--bg) 60%);border:1px solid #23233a;border-radius:14px;overflow:hidden;box-shadow:0 0 80px rgba(88,196,221,0.10);}
  canvas{display:block;width:100%;height:100%;}
  .tag{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:2px;color:var(--muted);}
  .tag em{color:var(--blue);font-style:normal;}
  #controls{margin-top:18px;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);}
  button{font-family:inherit;font-size:12px;letter-spacing:1px;background:#1a1a28;color:var(--text);border:1px solid #2c2c44;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.2s;}
  button:hover{background:#23233a;border-color:var(--blue);}
</style>
</head>
<body>
  <div id="stage">
    <div class="tag"><em>■</em> CH0 / 引入：两个老问题</div>
    <canvas id="cv"></canvas>
  </div>
  <div id="controls"><button id="reset">↺ 重播</button></div>

<script>
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);let W=960,H=540;
function resize(){const s=document.getElementById('stage');const r=s.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

const FPS=30;
const TOTAL=1800; // 60s
let frame=0;

function setFrame(n){frame=n;draw();}
const state={last:0};
function loop(ts){const dt=state.last?Math.min((ts-state.last)/1000,0.05):0.016;state.last=ts;frame+=dt*FPS;if(frame>TOTAL+30)frame=0;setFrame(Math.floor(frame));requestAnimationFrame(loop);}

function draw(){
  ctx.clearRect(0,0,W,H);

  // 两个问题卡片淡入
  const t1=Math.min(1, frame/(FPS*1.5));     // 1.5s 淡入
  const t2=Math.max(0, Math.min(1, (frame-FPS*2)/(FPS*1.5))); // 2s后第二张

  ctx.save();
  // 卡片1：瞬时速度
  ctx.globalAlpha=t1;
  const cx1=W*0.32, cy1=H*0.55;
  ctx.fillStyle='rgba(20,20,40,0.9)';ctx.strokeStyle='rgba(88,196,221,0.6)';ctx.lineWidth=2;
  roundRect(cx1-170,cy1-100,340,200,16);
  ctx.fill();ctx.stroke();
  ctx.fillStyle='#58C4DD';ctx.font='600 30px "JetBrains Mono",monospace';ctx.textAlign='center';
  ctx.fillText('问题一', cx1, cy1-50);
  ctx.fillStyle='#fff';ctx.font='700 40px "JetBrains Mono",monospace';
  ctx.fillText('瞬时速度？', cx1, cy1+5);
  ctx.fillStyle='#8a8a9a';ctx.font='500 22px "JetBrains Mono",monospace';
  ctx.fillText('物体在某一瞬间多快', cx1, cy1+45);

  // 卡片2：面积
  ctx.globalAlpha=t2;
  const cx2=W*0.68, cy2=H*0.55;
  ctx.fillStyle='rgba(20,20,40,0.9)';ctx.strokeStyle='rgba(131,193,103,0.6)';ctx.lineWidth=2;
  roundRect(cx2-170,cy2-100,340,200,16);
  ctx.fill();ctx.stroke();
  ctx.fillStyle='#83C167';ctx.font='600 30px "JetBrains Mono",monospace';ctx.textAlign='center';
  ctx.fillText('问题二', cx2, cy2-50);
  ctx.fillStyle='#fff';ctx.font='700 40px "JetBrains Mono",monospace';
  ctx.fillText('弯曲面积？', cx2, cy2+5);
  ctx.fillStyle='#8a8a9a';ctx.font='500 22px "JetBrains Mono",monospace';
  ctx.fillText('不规则图形的面积', cx2, cy2+45);
  ctx.restore();

  // 标题
  ctx.save();
  ctx.globalAlpha=Math.min(1, frame/(FPS*0.8));
  ctx.fillStyle='#58C4DD';ctx.font='500 26px "JetBrains Mono",monospace';ctx.textAlign='center';
  ctx.fillText('微 积 分 到 底 在 解 决 什 么', W/2, H*0.22);
  ctx.fillStyle='#FFD93D';ctx.font='700 40px "JetBrains Mono",monospace';
  ctx.fillText('—— 两个老问题，一种思想', W/2, H*0.22+48);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

document.getElementById('reset').addEventListener('click',()=>setFrame(0));

const EXPORT_MODE=new URLSearchParams(location.search).get('export')==='1';
if(EXPORT_MODE){
  const s=document.getElementById('stage');s.style.width='1920px';s.style.maxWidth='none';s.style.height='1080px';s.style.aspectRatio='auto';s.style.border='none';s.style.borderRadius='0';s.style.boxShadow='none';
  document.body.style.margin='0';document.getElementById('controls').style.display='none';document.querySelector('.tag').style.display='none';
  resize();window.__renderFrame=(n)=>{setFrame(n);};setFrame(0);
}else{requestAnimationFrame(loop);}
</script>
</body>
</html>
