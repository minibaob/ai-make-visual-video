<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>为什么 sin 的导数藏在单位圆里</title>
<style>
  :root{--bg:#0A0A0F;--blue:#58C4DD;--green:#83C167;--yellow:#FFD93D;--red:#FF6B6B;--text:#EAEAEA;--muted:#8a8a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"JetBrains Mono","SF Mono","Consolas",monospace;color:var(--text);}
  #stage{width:960px;max-width:96vw;aspect-ratio:16/9;position:relative;background:radial-gradient(120% 120% at 50% 0%, #14142a 0%, var(--bg) 60%);border:1px solid #23233a;border-radius:14px;overflow:hidden;box-shadow:0 0 80px rgba(88,196,221,0.10);}
  canvas{display:block;width:100%;height:100%;}
  .tag{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:2px;color:var(--muted);}
  .tag em{color:var(--blue);font-style:normal;}
  #controls{margin-top:18px;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);}
  button{font-family:inherit;font-size:12px;letter-spacing:1px;background:#1a1a28;color:var(--text);border:1px solid #2c2c44;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.2s;}
  button:hover{background:#23233a;border-color:var(--blue);}
</style>
</head>
<body>
  <div id="stage">
    <div class="tag"><em>■</em> UNIT CIRCLE / sin 的导数</div>
    <canvas id="cv"></canvas>
  </div>
  <div id="controls"><button id="reset">↺ 重播</button></div>

<script>
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);let W=960,H=540;
function resize(){const s=document.getElementById('stage');const r=s.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

const FPS=30;
const INTRO_END=75, P0_END=180, P1_END=300, P2_END=430, OUTRO_END=510;
let frame=0;

// 布局在 draw() 内动态计算，保证导出时正确缩放

function setFrame(n){frame=n;draw();}
const state={last:0};
function loop(ts){const dt=state.last?Math.min((ts-state.last)/1000,0.05):0.016;state.last=ts;frame+=dt*FPS;if(frame>OUTRO_END+30)frame=0;setFrame(Math.floor(frame));requestAnimationFrame(loop);}

function theta(){
  if(frame<INTRO_END) return -0.35;
  return -0.35 + (frame-INTRO_END)*0.022;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // 布局动态计算（保证导出 1920x1080 时正确缩放）
  const cx=W*0.28, cy=H*0.58, R=H*0.33;
  const th = theta();
  const pxr = cx + R*Math.cos(th);
  const pyr = cy - R*Math.sin(th);

  // ===== 左侧：单位圆 =====
  ctx.save();
  // 圆
  ctx.strokeStyle='rgba(200,200,230,0.35)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  // 坐标轴
  ctx.strokeStyle='rgba(180,180,210,0.3)'; ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(cx-R*1.15,cy);ctx.lineTo(cx+R*1.15,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy-R*1.15);ctx.lineTo(cx,cy+R*1.15);ctx.stroke();

  // sin 竖直投影（黄色虚线，从圆上点到 x 轴）
  ctx.strokeStyle='rgba(255,217,61,0.85)'; ctx.lineWidth=3; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(pxr,pyr); ctx.lineTo(pxr,cy); ctx.stroke();
  ctx.setLineDash([]);
  // cos 水平投影（绿色虚线，从圆心到点的竖直投影足）
  ctx.strokeStyle='rgba(131,193,103,0.85)'; ctx.lineWidth=3; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(pxr,cy); ctx.stroke();
  ctx.setLineDash([]);

  // 半径
  ctx.strokeStyle='#58C4DD'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(pxr,pyr); ctx.stroke();

  // 角度弧
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,R*0.28, Math.min(0,-th), Math.max(0,-th)); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='600 18px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText('θ', cx+R*0.36, cy-R*0.14);

  // 速度向量（切线方向，加长加粗）
  const vt = R*0.55;
  const vx = -Math.sin(th), vy = Math.cos(th);
  ctx.strokeStyle='#FF6B6B'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.shadowColor='rgba(255,107,107,0.6)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(pxr,pyr); ctx.lineTo(pxr+vx*vt, pyr-vy*vt); ctx.stroke();
  ctx.shadowBlur=0;
  // 速度竖直分量（= cos，黄色高亮，这就是 sin 的导数）
  const vycomp = -vy*vt; // 屏幕向下为负，vy 分量为 -vy*vt
  ctx.strokeStyle='#FFD93D'; ctx.lineWidth=4; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(pxr+vx*vt, pyr); ctx.lineTo(pxr+vx*vt, pyr-vy*vt); ctx.stroke();
  ctx.setLineDash([]);
  // 分量标注
  ctx.fillStyle='#FF6B6B'; ctx.font='600 17px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText('速度 v', pxr+vx*vt+10, (pyr + pyr-vy*vt)/2);
  ctx.fillStyle='#FFD93D';
  ctx.fillText('竖直分量 = cosθ', pxr+vx*vt+10, pyr-vy*vt+6);

  // 圆上点
  ctx.fillStyle='#FFD93D'; ctx.shadowColor='#FFD93D'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(pxr,pyr,8,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();

  // sin/cos 投影标签（放在圆的下方，避免拥挤）
  ctx.save();
  ctx.fillStyle='#FFD93D'; ctx.font='600 17px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText('sinθ（高度）', cx, cy+R+42);
  ctx.fillStyle='#83C167';
  ctx.fillText('cosθ（水平）', cx, cy+R+68);
  ctx.restore();

  // ===== 右侧：sin 曲线 =====
  // 让曲线区垂直映射与单位圆对齐：gyMid=cy, amp=R，这样投影虚线是水平的
  const gx0=W*0.60, gx1=W*0.98, gyMid=cy, amp=R;
  ctx.save();
  // 坐标轴
  ctx.strokeStyle='rgba(180,180,210,0.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(gx0,gyMid); ctx.lineTo(gx1,gyMid); ctx.stroke();  // x轴
  ctx.beginPath(); ctx.moveTo(gx0,gyMid-amp); ctx.lineTo(gx0,gyMid+amp); ctx.stroke(); // y轴
  // 刻度标记 π/2, π, 3π/2
  ctx.fillStyle='#8a8a9a'; ctx.font='500 14px "JetBrains Mono",monospace'; ctx.textAlign='center';
  const marks=[['π/2',0.25],['π',0.5],['3π/2',0.75],['2π',1.0]];
  for(const [lab,fr] of marks){ const mx=gx0+(gx1-gx0)*fr; ctx.beginPath();ctx.moveTo(mx,gyMid-5);ctx.lineTo(mx,gyMid+5);ctx.stroke(); ctx.fillText(lab, mx, gyMid+22); }

  // sin 曲线
  ctx.strokeStyle='#FFD93D'; ctx.lineWidth=4; ctx.lineJoin='round';
  ctx.shadowColor='rgba(255,217,61,0.5)'; ctx.shadowBlur=10;
  ctx.beginPath();
  for(let i=0;i<=240;i++){
    const x=2*Math.PI*i/240;
    const y=Math.sin(x);
    const sx=gx0+(gx1-gx0)*i/240;
    const sy=gyMid - y*amp;
    if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
  }
  ctx.stroke();
  ctx.shadowBlur=0;

  // 当前 θ 对应曲线点
  const thNorm = ((th % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const curX = gx0 + (thNorm/(2*Math.PI))*(gx1-gx0);
  const curY = gyMid - Math.sin(th)*amp;

  // 水平投影虚线：从圆上点连到曲线点（展示 sin 高度对应）
  ctx.strokeStyle='rgba(255,217,61,0.4)'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(pxr, pyr); ctx.lineTo(curX, curY); ctx.stroke();
  ctx.setLineDash([]);

  // 切线（斜率 = cosθ = sin 的导数），画在曲线范围内
  const dydx = Math.cos(th);
  const txlen = 70;
  ctx.strokeStyle='#58C4DD'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.shadowColor='rgba(88,196,221,0.6)'; ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(curX-txlen, curY - dydx*(-txlen)*amp/((gx1-gx0)/(2*Math.PI)));
  ctx.lineTo(curX+txlen, curY - dydx*(txlen)*amp/((gx1-gx0)/(2*Math.PI)));
  ctx.stroke();
  ctx.shadowBlur=0;

  // 曲线点
  ctx.fillStyle='#FFFFFF'; ctx.shadowColor='#fff'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(curX,curY,6,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();

  // 顶部文字
  ctx.save(); ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.font='600 24px "JetBrains Mono",monospace';
  ctx.fillText('sin 的导数 = ?', 24, 48);
  ctx.font='500 18px "JetBrains Mono",monospace';
  if(frame<INTRO_END){ ctx.fillStyle='#EAEAEA'; ctx.fillText('答案不在公式表里，在圆上',24,80); }
  else if(frame<P0_END){ ctx.fillStyle='#FFD93D'; ctx.fillText('点匀速转，sin 是它的高度',24,80); }
  else if(frame<P1_END){ ctx.fillStyle='#FFD93D'; ctx.fillText('速度的竖直分量 = cosθ',24,80); }
  else { ctx.fillStyle='#83C167'; ctx.fillText('d/dx sin = cos —— 藏在圆里',24,80); }
  ctx.restore();

  if(frame<INTRO_END) drawIntro(frame/INTRO_END);
  if(frame>=P2_END) drawOutro((frame-P2_END)/(OUTRO_END-P2_END));
}

function drawIntro(t){
  ctx.save();ctx.fillStyle='#0A0A0F';ctx.fillRect(0,0,W,H);
  const ease=t<0.25?0:Math.min(1,(t-0.25)/0.5);ctx.globalAlpha=ease;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#58C4DD';ctx.font='500 22px "JetBrains Mono",monospace';
  ctx.fillText('三 角 函 数 · 导 数', W/2, H*0.36);
  ctx.fillStyle='#FFFFFF';ctx.font='700 50px "JetBrains Mono",monospace';
  ctx.fillText('为什么 sin 的导数', W/2, H*0.48);
  ctx.fillStyle='#FFD93D';
  ctx.fillText('是 cos ？', W/2, H*0.48+64);
  ctx.fillStyle='#EAEAEA';ctx.font='500 24px "JetBrains Mono",monospace';
  ctx.fillText('—— 答案就藏在单位圆里', W/2, H*0.48+124);
  ctx.restore();
}
function drawOutro(t){
  ctx.save();
  const grad=ctx.createLinearGradient(0,H*0.35,0,H);grad.addColorStop(0,'rgba(10,10,15,0)');grad.addColorStop(1,'rgba(10,10,15,0.92)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  const ease=Math.min(1,t/0.3);ctx.globalAlpha=ease;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#FFFFFF';ctx.font='700 44px "JetBrains Mono",monospace';
  ctx.fillText('d/dx sin(x) = cos(x)', W/2, H*0.70);
  ctx.fillStyle='#83C167';ctx.font='500 26px "JetBrains Mono",monospace';
  ctx.fillText('圆的旋转，写下了这个公式', W/2, H*0.70+46);
  ctx.fillStyle='#FFD93D';ctx.font='600 28px "JetBrains Mono",monospace';
  ctx.fillText('看懂圆，就懂了一半微积分', W/2, H*0.70+102);
  if(t>0.5){ctx.globalAlpha=Math.min(1,(t-0.5)/0.3);ctx.fillStyle='#8a8a9a';ctx.font='500 22px "JetBrains Mono",monospace';ctx.fillText('关注 · 每天一个可视化概念',W/2,H*0.90);}
  ctx.restore();
}

document.getElementById('reset').addEventListener('click',()=>setFrame(0));

const EXPORT_MODE=new URLSearchParams(location.search).get('export')==='1';
if(EXPORT_MODE){
  const s=document.getElementById('stage');s.style.width='1920px';s.style.maxWidth='none';s.style.height='1080px';s.style.aspectRatio='auto';s.style.border='none';s.style.borderRadius='0';s.style.boxShadow='none';
  document.body.style.margin='0';document.getElementById('controls').style.display='none';document.querySelector('.tag').style.display='none';
  resize();window.__renderFrame=(n)=>{setFrame(n);};setFrame(0);
}else{requestAnimationFrame(loop);}
</script>
</body>
</html>
