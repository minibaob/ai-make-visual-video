<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>π 弹珠 · 封面</title>
<style>
  :root{--bg:#0A0A0F;--blue:#58C4DD;--yellow:#FFD93D;--green:#83C167;--muted:#8a8a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);overflow:hidden;font-family:"JetBrains Mono","Consolas",monospace;}
  #wrap{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(85% 55% at 50% 46%, #191a34 0%, #0A0A0F 62%);}
  .tag{position:absolute;left:0;right:0;top:288px;text-align:center;font-size:26px;letter-spacing:8px;color:var(--blue);}
  h1{position:absolute;left:0;right:0;top:368px;text-align:center;font-size:82px;font-weight:700;color:#fff;letter-spacing:2px;}
  h1 em{font-style:normal;color:var(--yellow);}
  .sub{position:absolute;left:0;right:0;top:474px;text-align:center;font-size:82px;font-weight:700;color:var(--yellow);}
  #art{position:absolute;left:0;top:650px;width:1080px;height:520px;}
  .formula{position:absolute;left:0;right:0;top:1236px;text-align:center;font-size:40px;color:var(--green);letter-spacing:2px;}
  .hint{position:absolute;left:0;right:0;top:1300px;text-align:center;font-size:24px;color:var(--muted);}
  .pill{position:absolute;left:50%;transform:translateX(-50%);top:1400px;
    display:flex;align-items:center;gap:16px;height:84px;padding:0 44px;
    border:3px solid var(--yellow);border-radius:48px;font-size:30px;color:var(--yellow);letter-spacing:2px;}
  .pill i{width:13px;height:13px;border-radius:50%;background:var(--yellow);}
</style>
</head>
<body>
<div id="wrap">
  <div class="tag">台 球 实 验</div>
  <h1>撞到第<em>31</em>次</h1>
  <div class="sub">你会看到 π</div>
  <canvas id="art" width="1080" height="520"></canvas>
  <div class="formula">π = 3.14159265358979</div>
  <div class="hint">质量比 100 : 1 · 弹性碰撞</div>
  <div class="pill"><i></i>20 秒，一颗弹珠讲完 π</div>
</div>
<script>
const cv=document.getElementById('art');
const ctx=cv.getContext('2d');
const W=1080,H=520;
const CY=300, SX0=90, SX1=990, VIEW=7.8;
const U=(SX1-SX0)/VIEW;
const PX=x=>SX0+x*U;
const RP1=1.0*U, RP2=0.55*U;

function ball(cx,cy,R,cIn,cMid,cOut){
  const g=ctx.createRadialGradient(cx-R*0.32,cy-R*0.36,R*0.08,cx,cy,R*1.02);
  g.addColorStop(0,cIn); g.addColorStop(0.52,cMid); g.addColorStop(1,cOut);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.arc(cx,cy,R-1.5,0,Math.PI*2); ctx.stroke();
}

ctx.strokeStyle='rgba(150,150,190,0.16)'; ctx.lineWidth=2;
ctx.beginPath(); ctx.moveTo(0,CY+RP1+34); ctx.lineTo(W,CY+RP1+34); ctx.stroke();

const wx=PX(0);
ctx.strokeStyle='rgba(220,220,240,0.6)'; ctx.lineWidth=8; ctx.lineCap='round';
ctx.beginPath(); ctx.moveTo(wx,CY-RP1-60); ctx.lineTo(wx,CY+RP1+64); ctx.stroke();
for(let y=CY-RP1-44; y<CY+RP1+64; y+=34){
  ctx.strokeStyle='rgba(180,180,210,0.28)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(wx-26,y+16); ctx.lineTo(wx,y); ctx.stroke();
}

const cx2=PX(2.45), cx1=PX(4.45);
ball(cx1,CY,RP1,'#9FE7F8','#58C4DD','#2A6E80');
ball(cx2,CY,RP2,'#FFF0A8','#FFD93D','#8A6A0F');

ctx.font='700 '+Math.round(RP1*0.30)+'px "JetBrains Mono",monospace';
ctx.fillStyle='#0E2A33'; ctx.textAlign='center'; ctx.textBaseline='middle';
ctx.fillText('100x',cx1,CY);
ctx.font='700 '+Math.round(RP2*0.34)+'px "JetBrains Mono",monospace';
ctx.fillStyle='#4A3A00';
ctx.fillText('1x',cx2,CY);


</script>
</body>
</html>
